<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Flight Sim</title>
  <!-- installed to the home screen: full screen, drawn under the status bar and notch -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flight Sim">
  <meta name="theme-color" content="#0b0f14">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
    #bevy { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    html, body { overscroll-behavior: none; touch-action: none; }
    /* matches the game's own loading screen (src/loading.rs), which takes over */
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #9fe6a0; font: 18px/1 "Roboto Mono", ui-monospace, Menlo, monospace;
      background: #0b0f14;
    }
    #overlay .bar { width: 220px; height: 3px; background: rgba(159, 230, 160, .18); overflow: hidden; }
    #overlay .bar div { width: 30%; height: 100%; background: #9fe6a0; animation: slide 1.1s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-40%); } to { transform: translateX(270%); } }
    #overlay.hidden { display: none; }
    #safe { position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #debug {
      position: fixed; left: 0; top: 0; width: 55%; max-height: 100%; overflow: auto;
      z-index: 11; padding: 6px 8px; white-space: pre-wrap; pointer-events: none;
      font: 10px/1.3 ui-monospace, Menlo, monospace; color: #d8ffd8; background: rgba(0, 0, 0, .7);
    }
    #errors {
      position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 45%; overflow: auto;
      display: none; z-index: 10; padding: 8px 10px; white-space: pre-wrap;
      font: 11px/1.4 ui-monospace, Menlo, monospace; color: #ffb4a8;
      background: rgba(20, 0, 0, .85); border: 1px solid #a33;
    }
  </style>
</head>
<body>
  <canvas id="bevy" tabindex="0"></canvas>
  <div id="overlay">
    <div>FLIGHT SIM</div>
    <div class="bar"><div></div></div>
  </div>
  <div id="safe"></div>
  <div id="errors"></div>
  <pre id="debug" hidden></pre>
  <script>
    // Show errors on the page too: there's no console on a phone.
    (() => {
      const box = document.getElementById("errors");
      const show = (msg) => {
        // bevy's log lines carry %c styling arguments; drop them
        msg = String(msg).replace(/%c/g, "").split(" color:")[0].slice(0, 1500);
        box.style.display = "block";
        box.textContent += msg + "\n\n";
      };
      const origError = console.error.bind(console);
      console.error = (...args) => { origError(...args); show(args[0]); };
      addEventListener("error", (e) => show("error: " + (e.message || e.error)));
      addEventListener("unhandledrejection", (e) => {
        const r = String(e.reason);
        if (!r.includes("Using exceptions for control flow") && !r.includes("pointer lock")) show("rejection: " + r);
      });
      window.__showError = show;

      // Report WGSL compile errors with the offending lines (Safari's and
      // Chrome's compilers are stricter than naga, which the native build uses).
      // Bevy's PBR shaders alias texture/sampler bindings with `let` (e.g.
      // `let texture = base_color_texture;`). The WGSL spec forbids that (they
      // aren't constructible types); Chrome lets it slide, Safari doesn't. Undo
      // the aliases: drop those lines and use the binding name directly.
      const fixHandleLets = (code) => {
        const handles = new Set();
        for (const m of code.matchAll(/var\s+(\w+)\s*:\s*(texture_\w+|sampler(?:_comparison)?)\b/g)) handles.add(m[1]);
        if (!handles.size) return code;
        const out = [];
        let depth = 0;
        let aliases = []; // { name, target, depth }
        for (let line of code.split("\n")) {
          const m = /^\s*let\s+(\w+)\s*=\s*(\w+)\s*;\s*$/.exec(line);
          const target = m && (handles.has(m[2]) ? m[2] : aliases.findLast((a) => a.name === m[2])?.target);
          if (m && target) {
            aliases.push({ name: m[1], target, depth });
            out.push(""); // keep the line numbers
            continue;
          }
          const seen = new Set();
          for (let i = aliases.length - 1; i >= 0; i--) {
            const a = aliases[i];
            if (seen.has(a.name)) continue;
            seen.add(a.name);
            line = line.replace(new RegExp("(?<![\\w.])" + a.name + "\\b", "g"), a.target);
          }
          for (const ch of line) {
            if (ch === "{") depth++;
            else if (ch === "}") depth--;
          }
          aliases = aliases.filter((a) => a.depth <= depth);
          out.push(line);
        }
        return out.join("\n");
      };
      window.__fixHandleLets = fixHandleLets;

      if (window.GPUDevice) {
        const csm = GPUDevice.prototype.createShaderModule;
        GPUDevice.prototype.createShaderModule = function (desc) {
          if (typeof desc.code === "string" && desc.code.includes("let ")) desc = { ...desc, code: fixHandleLets(desc.code) };
          // an error scope catches the creation error itself, with its message
          this.pushErrorScope("validation");
          const m = csm.call(this, desc);
          this.popErrorScope().then((err) => {
            if (!err) return;
            const lines = String(desc.code).split("\n");
            const at = /(?:line |:)(\d+)(?::\d+)?/.exec(err.message);
            const n = at ? Number(at[1]) : 0;
            const around = n ? lines.slice(Math.max(0, n - 2), n + 1).map((l) => l.trim()).join(" ⏎ ") : "";
            const tags = ["valley_mist", "atlas_sampler", "plume", "haze", "cloud", "terrain", "scenery", "detail"].filter((t) => desc.code.includes(t));
            show("WGSL error [" + tags.join(",") + "]: " + err.message.slice(0, 600) + (around ? "\n  line " + n + ": " + around.slice(0, 400) : ""));
          });
          m.getCompilationInfo?.().then((info) => {
            for (const e of info.messages) {
              if (e.type !== "error") continue;
              const lines = String(desc.code).split("\n");
              const around = lines.slice(Math.max(0, e.lineNum - 2), e.lineNum + 1).map((l) => l.trim()).join(" ⏎ ");
              show("WGSL error: " + e.message + "\n  line " + e.lineNum + ": " + around.slice(0, 400));
            }
          });
          return m;
        };
      }

      // A lost GPU device leaves the last frame frozen on screen with no error
      // logged (on iOS usually the GPU process running out of memory): say so.
      if (window.GPUAdapter) {
        const reqDev = GPUAdapter.prototype.requestDevice;
        GPUAdapter.prototype.requestDevice = async function (d) {
          const dev = await reqDev.call(this, d);
          dev.lost.then((i) => show("GPU device lost (" + i.reason + "): " + i.message + "\nUsually this means the GPU ran out of memory."));
          dev.addEventListener("uncapturederror", (e) => show("GPU error: " + e.error.message));
          return dev;
        };
      }

      // ?debug: mirror the whole log and some GPU/canvas state on the page
      if (!new URLSearchParams(location.search).has("debug")) return;
      const dbg = document.getElementById("debug");
      dbg.hidden = false;
      const lines = [];
      let status = "";
      const render = () => { dbg.textContent = status + "\n" + lines.join("\n"); };
      const log = (level, args) => {
        const msg = String(args[0]).replace(/%c/g, "").split(" color:")[0].replace(/\/Users\/[^ ]*?\/src\//g, "").slice(0, 300);
        lines.push(level + " " + msg);
        if (lines.length > 60) lines.shift();
        render();
      };
      for (const level of ["log", "info", "warn", "error", "debug"]) {
        const orig = console[level].bind(console);
        console[level] = (...args) => { orig(...args); log(level[0].toUpperCase(), args); };
      }
      // count what the renderer does with the GPU, and catch device loss
      let submits = 0, textures = 0;
      if (window.GPUQueue) {
        const submit = GPUQueue.prototype.submit;
        GPUQueue.prototype.submit = function (...a) { submits++; return submit.apply(this, a); };
        const cur = GPUCanvasContext.prototype.getCurrentTexture;
        GPUCanvasContext.prototype.getCurrentTexture = function (...a) { textures++; return cur.apply(this, a); };
        const cfg = GPUCanvasContext.prototype.configure;
        GPUCanvasContext.prototype.configure = function (c) {
          log("G", ["canvas configure " + c.format + " alpha=" + c.alphaMode + " usage=" + c.usage]);
          return cfg.call(this, c);
        };
        const reqDev2 = GPUAdapter.prototype.requestDevice;
        GPUAdapter.prototype.requestDevice = async function (d) {
          log("G", ["requestDevice features=" + [...(d?.requiredFeatures || [])].join(",")]);
          const dev = await reqDev2.call(this, d);
          dev.lost.then((i) => log("G", ["DEVICE LOST: " + i.reason + " " + i.message]));
          return dev;
        };
      }
      (async () => {
        const a = navigator.gpu && (await navigator.gpu.requestAdapter());
        const info = a ? (a.info ? a.info.vendor + " " + a.info.architecture : "?") : "none";
        const lim = a ? "maxTex2D=" + a.limits.maxTextureDimension2D + " maxBuf=" + a.limits.maxBufferSize + " storageBufs/stage=" + a.limits.maxStorageBuffersPerShaderStage : "";
        const feats = a ? [...a.features].join(",") : "";
        const c = document.getElementById("bevy");
        setInterval(() => {
          status = "build __BUILD__" + (window.FLIGHT_SIM_LOW_MEMORY ? " LOW" : "") + (window.FLIGHT_SIM_NO_ATMOSPHERE ? " NOATMO" : "") + " · adapter " + info + " " + lim + "\nfeatures " + feats + "\ncanvas " + c.width + "x" + c.height + " css " + c.clientWidth + "x" + c.clientHeight +
            " dpr " + devicePixelRatio + "\nsubmits " + submits + " frames " + textures;
          render();
        }, 1000);
      })();
    })();
  </script>
  <script type="module">
    // Browsers keep audio suspended until the page is clicked: remember every
    // AudioContext the game makes and resume them all on the first gesture.
    const contexts = [];
    for (const name of ["AudioContext", "webkitAudioContext"]) {
      const Orig = window[name];
      if (!Orig) continue;
      window[name] = new Proxy(Orig, {
        construct(target, args) { const c = new target(...args); contexts.push(c); return c; },
      });
    }
    // only suspended ones: a closed context rejects resume()
    const resume = () => contexts.forEach((c) => c.state === "suspended" && c.resume().catch(() => {}));
    for (const ev of ["pointerdown", "keydown", "touchstart"]) addEventListener(ev, resume, { capture: true });

    // Render at most 1.5x on touch devices (2x elsewhere): a phone at 3x pushes
    // ~4x the pixels through the clouds and post-processing, and runs out of
    // GPU memory. winit sizes the canvas from devicePixelRatio, so cap that.
    {
      const real = window.devicePixelRatio || 1;
      const cap = navigator.maxTouchPoints > 0 ? 1.5 : 2;
      if (real > cap) Object.defineProperty(window, "devicePixelRatio", { get: () => cap, configurable: true });
    }

    // Phones and tablets: the low-memory mode (see src/platform.rs)
    {
      const q = new URLSearchParams(location.search);
      window.FLIGHT_SIM_LOW_MEMORY = q.has("low") || (navigator.maxTouchPoints > 0 && !q.has("high"));
      // ?weather=clear|broken|overcast|hazy and ?time=dawn|morning|midday|afternoon|golden
      // pin the round's environment (src/environment.rs); otherwise it's rolled from the map seed
      window.FLIGHT_SIM_WEATHER = q.get("weather") || "";
      window.FLIGHT_SIM_TIME = q.get("time") || "";
    }

    // Safe-area insets for the touch controls (read by src/platform.rs)
    {
      const probe = document.getElementById("safe");
      const read = () => {
        const cs = getComputedStyle(probe);
        window.FLIGHT_SIM_SAFE_AREA = ["paddingLeft", "paddingTop", "paddingRight", "paddingBottom"].map((k) => parseFloat(cs[k]) || 0);
      };
      read();
      addEventListener("resize", read);
    }

    const overlay = document.getElementById("overlay");
    const canvas = document.getElementById("bevy");

    // Let the overlay paint before the game module starts loading.
    if (!navigator.gpu) {
      window.__showError("This browser has no WebGPU, so the game may not render. It needs a recent Chrome, Edge or Safari (iOS 26+).");
    } else {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) window.__showError("WebGPU is present but no GPU adapter was available.");
      // Bevy's atmosphere needs filterable 32-bit float textures; without them
      // the game draws a plain sky instead (src/platform.rs)
      window.FLIGHT_SIM_NO_ATMOSPHERE =
        new URLSearchParams(location.search).has("noatmo") || !adapter?.features.has("float32-filterable");
    }
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 50)));
    try {
      const { default: init } = await import("./flight_sim.js");
      await init();
    } catch (e) {
      // winit throws a control-flow exception to hand the loop to the browser; that one is fine
      if (!String(e).includes("Using exceptions for control flow")) {
        console.error(e);
        throw e;
      }
    }
    // init returns before the first frame, and the first frames bake the cloud
    // noise (a short freeze): hide the overlay once frames are flowing after that.
    let frames = 0;
    const watch = () => {
      if (++frames >= 20) {
        overlay.classList.add("hidden");
        canvas.focus();
      } else requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
  </script>
</body>
</html>
