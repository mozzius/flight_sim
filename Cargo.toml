[package]
name = "flight_sim"
version = "0.4.0"
edition = "2024"
default-run = "flight_sim"

# Two binaries from one crate:
# - flight_sim: the game (the default `client` feature)
# - flight_sim_server: the headless multiplayer server
#   (`cargo run --release --no-default-features --features server --bin flight_sim_server`)
[[bin]]
name = "flight_sim"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "flight_sim_server"
path = "src/server/main.rs"
required-features = ["server"]

[features]
default = ["client"]
# (reqwest and the rest are native-only deps: the native sign-in, src/oauth; the web build signs in in web/auth.js)
client = [
    "bevy/default", "bevy/wav", "bevy/system_clipboard", "dep:bevy_transform_interpolation", "dep:rand", "dep:tokio",
    "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest", "dep:serde_json", "dep:base64", "dep:p256", "dep:sha2",
    "dep:open",
]
# no rendering, windowing or audio: just the ECS, time and logging
server = ["dep:tokio", "dep:axum", "dep:futures-util", "dep:rand", "atproto"]
# atproto service-auth verification (src/atproto): the server's, the client never needs it
atproto = ["dep:reqwest", "dep:serde_json", "dep:base64", "dep:bs58", "dep:k256", "dep:p256"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log"] }
bevy_transform_interpolation = { version = "0.6", optional = true }
rand = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# native: the server (axum), and the native client's WebSocket on a background tokio thread
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"], optional = true }
# wss:// with rustls (ring, like reqwest) and bundled webpki roots
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"], optional = true }

# atproto service-auth verification (the `atproto` feature, server side) and
# the native client's OAuth sign-in (src/oauth).
# rustls with bundled webpki roots: no openssl or CA bundle needed.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
bs58 = { version = "0.5", optional = true }
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
sha2 = { version = "0.10", optional = true }
# opens the system browser for sign-in
open = { version = "5", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Web build: WebGPU (with a WebGL2 fallback), and a browser-backed RNG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", features = ["wav", "webgpu", "webgl2"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Event"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
