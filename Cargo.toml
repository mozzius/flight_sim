[package]
name = "flight_sim"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }
bevy_transform_interpolation = "0.6"
rand = "0.10"

# atproto service-auth verification (src/atproto, server side only). rustls
# with bundled webpki roots: no openssl or CA bundle needed in the image.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Web build: WebGPU (with a WebGL2 fallback), and a browser-backed RNG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", features = ["wav", "webgpu", "webgl2"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
